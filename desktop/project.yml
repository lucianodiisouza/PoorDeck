name: WebDeck
options:
  bundleIdPrefix: com.webdeck
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode: Network.framework C-style callbacks are painful
    # under Swift 6 strict concurrency. Revisit once the plumbing is stable.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  WebDeck:
    type: application
    platform: macOS
    sources:
      - path: Sources/WebDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webdeck.app
        PRODUCT_NAME: WebDeck
        INFOPLIST_FILE: Sources/WebDeck/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/WebDeck/WebDeck.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
