name: PoorDeck
options:
  bundleIdPrefix: dev.oprimo.poordeck
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift 5 language mode: Network.framework C-style callbacks are painful
    # under Swift 6 strict concurrency. Revisit once the plumbing is stable.
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  PoorDeck:
    type: application
    platform: macOS
    sources:
      - path: Sources/PoorDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oprimo.poordeck.app
        PRODUCT_NAME: PoorDeck
        INFOPLIST_FILE: Sources/PoorDeck/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/PoorDeck/PoorDeck.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.2"
    # Fold the unit tests into the auto-generated PoorDeck scheme so
    # `xcodebuild test -scheme PoorDeck` runs them.
    scheme:
      testTargets:
        - PoorDeckTests

  # Host-based unit tests. `@testable import PoorDeck` reuses the app module,
  # so the tests exercise the real (MainActor) PackCodec + Codable wire types.
  # AppDelegate skips server.start() under XCTest, so the host stays hermetic.
  PoorDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: PoorDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oprimo.poordeck.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PoorDeck.app/Contents/MacOS/PoorDeck"
        BUNDLE_LOADER: "$(TEST_HOST)"
        MACOSX_DEPLOYMENT_TARGET: "14.2"
